# tmux 3.8 configuration

# Prefix: C-a instead of C-b
set -g prefix C-a
unbind C-b
bind C-a send-prefix   # press C-a twice to send C-a to the app

# Core behaviour
set -s escape-time 10           # 1 can split Alt combos over SSH
set -s extended-keys on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on
set -g mouse on                 # default in 3.8, explicit for clarity
bind R source-file ~/.tmux.conf \; display "config reloaded"

# Splits and new windows open in the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane movement (vim keys)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window movement
bind a last-window              # replaces the default 'l', used above
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Pane resizing (repeatable: prefix once, then H/H/H...)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vi copy mode; copies reach the macOS clipboard via OSC 52
setw -g mode-keys vi
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
setw -g copy-mode-line-numbers hybrid
setw -g pane-scrollbars auto-hide

# Activity: highlight the window tab instead of flashing messages
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style "fg=themeyellow,bold"

# Status line using theme colours, so it follows terminal light/dark mode
set -g theme detect
set -g status-style "fg=themewhite,bg=themeblack"
set -g status-left-length 40
set -g status-left "#[fg=themegreen]#S #[fg=themeyellow]#I #[fg=themecyan]#P "
set -g status-right "#[fg=themecyan]%d %b %R"
set -g status-interval 15
set -g status-justify centre

# Modal scratch shell: Esc or C-c (or click outside) closes it
bind S new-pane -O -C -D -c "#{pane_current_path}"

# Keep a pane open after its command fails, until a key is pressed
setw -g remain-on-exit failed-key

